name: tenkai
description: "Your second brain."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  audioplayers: ^6.7.1
  dartz: ^0.10.1
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^10.3.1
  flutter_soloud: ^3.5.4
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  hooks_riverpod: ^2.6.1
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/sounds/click1.mp3
    - assets/sounds/confirm.mp3
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_24pt-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter/static/Inter_24pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter/static/Inter_24pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/static/Inter_24pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/static/Inter_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/static/Inter_24pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/static/Inter_24pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/static/Inter_24pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter/static/Inter_24pt-Black.ttf
          weight: 900

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/static/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto/static/Roboto-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Roboto/static/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto/static/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/static/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/static/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto/static/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto/static/Roboto-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Roboto/static/Roboto-Black.ttf
          weight: 900
